<title>나만의 방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style id="css">
/* Layout: full-bleed 3D apartment, floating glass cards (status top-left, people top-right, owner controls bottom) */
:root{
  --bg:#e7e5f0; --bg2:#d7d4e6; --panel:rgba(255,255,255,.88); --fg:#24223a; --muted:#6a6784;
  --line:#d3d0e2; --accent:#2f7d6d; --accent-fg:#ffffff; --chip:#efedf6;
  --free:#22995f; --busy:#c9800f; --dnd:#cf3f58;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif; --body:"Gowun Dodum",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16151f; --bg2:#22202f; --panel:rgba(32,30,46,.88); --fg:#ecebf6; --muted:#a3a0bd;
  --line:#37344d; --accent:#5cc4ad; --accent-fg:#0d2621; --chip:#2b2940;
  --free:#4cd18f; --busy:#f0ad3d; --dnd:#ff6f87; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16151f; --bg2:#22202f; --panel:rgba(32,30,46,.88); --fg:#ecebf6; --muted:#a3a0bd;
  --line:#37344d; --accent:#5cc4ad; --accent-fg:#0d2621; --chip:#2b2940;
  --free:#4cd18f; --busy:#f0ad3d; --dnd:#ff6f87; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:radial-gradient(120% 90% at 50% 30%,var(--bg) 0%,var(--bg2) 100%);background-color:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;position:fixed;inset:0;width:100%;touch-action:manipulation}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer;image-rendering:pixelated}
#scene.drag{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font-family:var(--body);will-change:transform}
.lbl.main{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:6px 10px;box-shadow:0 6px 18px rgba(20,16,40,.18);text-align:center;max-width:220px;white-space:normal}
.lbl.main b{font-family:var(--display);font-weight:400;font-size:15px;display:block}
.lbl.main span{font-size:12px;color:var(--muted)}
.lbl.main::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
#chatLog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:96px;overflow:auto;font-size:13px;line-height:1.35}
#chatLog li{overflow-wrap:anywhere}#chatLog li b{font-weight:600;margin-right:4px}#chatLog li.own b{color:var(--accent)}#chatLog li.me{opacity:.85}
#chatLog .empty{color:var(--muted);font-size:12px}
.chatrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.chatrow input{flex:1 1 auto;min-width:0;font:inherit;font-size:16px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.chatrow .hint{flex:none;font-variant-numeric:tabular-nums}
.chatrow button{flex:none;font-size:15px;padding:6px 12px}
.lbl.bubble{background:#fffdf6;color:#2a2238;border:1px solid #e2d6bd;border-radius:10px;padding:3px 8px;font-size:13px;max-width:150px;white-space:normal;text-align:center;box-shadow:0 4px 12px rgba(20,16,40,.25);overflow-wrap:anywhere}
.lbl.pet{font-size:11px;background:rgba(255,246,230,.92);color:#7a5a2a;border:1px solid #e6cfa8;padding:1px 7px;border-radius:99px}
.lbl.guest{font-size:12px;background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:99px}
.lbl.zzz{font-family:var(--display);font-size:20px;color:#8b8fd9;text-shadow:0 1px 0 rgba(255,255,255,.4);animation:zz 2.4s ease-in-out infinite}
.lbl.sign{font-family:var(--display);font-size:15px;background:#fff6dc;color:#5a4410;border:2px solid #d9b45a;border-radius:6px;padding:4px 10px}
.lbl.steam{font-size:16px;color:#5aa9c9}
.lbl.mail{pointer-events:auto;cursor:pointer;font:inherit;font-family:var(--display);font-size:14px;background:#c8142b;color:#fff;border:2px solid #fff3d6;border-radius:99px;padding:3px 10px;box-shadow:0 4px 12px rgba(120,10,20,.35)}
.lbl.mail:hover,.lbl.mail:focus-visible{background:#a80f22;outline:2px solid #ffd36b}
#gbDlg .card{width:min(440px,100%);max-height:min(640px,calc(100vh - 32px));box-sizing:border-box}
#gbList{list-style:none;margin:0;padding:0;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:60px;flex:1 1 auto}
#gbList li{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
#gbList li .who{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:2px}
#gbList li .who b{color:var(--fg);font-weight:600}
#gbList li button{font-size:12px;padding:0 6px;min-height:0;border:0;background:none;color:#c8142b;cursor:pointer}
#gbList .empty{border:0;background:none;color:var(--muted);text-align:center}
#gbText{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box;resize:vertical;min-height:64px}
@keyframes zz{0%,100%{opacity:.35;margin-top:0}50%{opacity:1;margin-top:-10px}}

#ui{position:fixed;inset:0;pointer-events:none;display:grid;gap:12px;
  grid-template-columns:minmax(0,360px) 1fr minmax(0,250px);grid-template-rows:auto 1fr auto;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.card{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(20,16,40,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 16px;min-width:0}
.status{grid-column:1;grid-row:1;align-self:start;display:flex;flex-direction:column;gap:5px;padding:10px 14px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.status .eyebrow{font-family:var(--display);font-size:16px;letter-spacing:0;color:var(--fg);line-height:1.25;overflow-wrap:anywhere}
.status h1,.status #msg{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.status{position:relative}
.status h1{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2;text-wrap:balance}
.status p{margin:0;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--fg);font-size:12px}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.pill.free i{background:var(--free)} .pill.busy i{background:var(--busy)} .pill.dnd i{background:var(--dnd)}
.pill.on i{background:var(--free);box-shadow:0 0 0 3px color-mix(in srgb,var(--free) 25%,transparent)}
.people{grid-column:3;grid-row:1;align-self:start;display:flex;flex-direction:column;gap:10px}
.people h2{margin:0;font-family:var(--display);font-weight:400;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.people h2 .hr{display:flex;gap:8px;align-items:center}
.fold{font-family:var(--body);font-size:12px;padding:3px 10px;min-height:28px;border-radius:99px;line-height:1.2;white-space:nowrap}
.fold.unread{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.people.folded>*:not(h2){display:none!important}
.people.folded{gap:0}
.people h2 small{font-family:var(--body);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto}
#plist li{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
#plist li .dot{width:12px;height:12px;border-radius:50%;flex:none}
#plist li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#plist li .tag{font-size:11px;color:var(--muted);flex:none}
.hint{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:7px 12px;font-size:14px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:16px}
button.primary:disabled{opacity:.5;cursor:default}
button.link{background:none;border:none;padding:0;color:var(--accent);font-size:12px;text-decoration:underline}
.owner{grid-column:1 / span 2;grid-row:3;align-self:end;max-width:640px;display:flex;flex-direction:column;gap:12px}
.owner h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.owner h3 .dirty{font-family:var(--body);font-size:12px;color:var(--busy)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 11px;border-radius:99px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.sw{width:28px;height:28px;border-radius:50%;padding:0;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg)}
input[type=text],input[type=password]{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.two{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.dragtip{grid-column:3;grid-row:3;align-self:end;justify-self:end;font-size:12px;color:var(--muted);pointer-events:none;text-align:right}
.dlg{position:fixed;inset:0;display:grid;place-items:center;background:rgba(12,10,24,.45);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.dlg .card{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;padding:20px}
.dlg h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.fullbar{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:4px;text-align:center;width:min(340px,calc(100% - 32px));box-sizing:border-box}
.fullbar b{font-family:var(--display);font-weight:400;font-size:20px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
@media (max-width:720px){
  #ui{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;gap:8px;
    padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));
    padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px))}
  .card{border-radius:14px;padding:10px 12px}
  .status{grid-column:1;grid-row:1;gap:4px;padding:8px 12px}
  .eyebrow{font-size:11px}
  .status .eyebrow{font-size:15px}
  .status h1{font-size:19px}
  .status p{font-size:14px}
  .meta{gap:4px}
  .pill{padding:2px 8px;font-size:11px}
  .people{grid-column:1;grid-row:3;align-self:end;padding:8px 10px;gap:6px}
  .people h2{font-size:15px}
  #plist{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;max-height:none;gap:4px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #plist::-webkit-scrollbar{display:none}
  #plist li{flex:none;font-size:13px}
  .people .row{flex-wrap:wrap;align-items:center;gap:6px}
  .people .row button{flex:1 1 auto;min-height:40px;padding:6px 10px}
  .people .row button.link{min-height:0;padding:0 4px}
  #roomHint{display:none}
  #chatLog{max-height:58px;font-size:12px}
  .chatrow{margin-top:4px}
  .chatrow input{padding:6px 9px}
  .owner{position:fixed;left:max(8px, env(safe-area-inset-left, 0px));right:max(8px, env(safe-area-inset-right, 0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:none;max-height:52vh;max-height:52dvh;overflow:auto;z-index:5;box-shadow:0 -10px 40px rgba(10,8,20,.35);padding:14px 14px 16px}
  .owner .chips button{min-height:38px}
  .dragtip{display:none}
  .two{grid-template-columns:1fr}
  .lbl.main{max-width:170px;padding:4px 8px}
  .lbl.main b{font-size:13px}
  .lbl.main span{font-size:11px}
  .dlg .card{padding:16px}
}
@media (min-width:721px) and (max-height:520px){
  #ui{grid-template-columns:minmax(0,280px) 1fr minmax(0,210px);gap:8px;padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
  .card{padding:8px 12px;border-radius:12px}
  .status h1{font-size:18px}
  #plist{max-height:30vh}
  .owner{max-height:calc(100vh - 24px);overflow:auto;grid-row:1 / span 3;grid-column:2;align-self:end}
  .dragtip{display:none}
}
@media (max-width:720px) and (max-height:560px){
  .status .meta #ago{display:none}
}
@media (prefers-reduced-motion: reduce){.lbl.zzz{animation:none}#toast{transition:none}}
</style>
<template id="tpl"><canvas id="scene" aria-label="3층짜리 도트 집 화면. 누르면 그곳으로 걸어가요."></canvas>
<div id="labels"></div>
<div id="ui">
  <header class="card status" aria-live="polite">
    <div class="eyebrow" id="roomName">내 방</div>
    <h1 id="act">불러오는 중</h1>
    <p id="msg" hidden></p>
    <div class="meta"><span class="pill" id="avail"><i></i><span></span></span><span class="pill on" id="online" hidden><i></i>지금 접속 중</span><span id="ago"></span><span class="pill" id="clock"></span></div>
  </header>
  <aside class="card people">
    <h2><span>지금 방에 있는 사람</span><span class="hr"><small id="count"></small><button id="peopleFold" type="button" class="fold" aria-expanded="true" aria-controls="plist chatBox">접기 ▼</button></span></h2>
    <ul id="plist"></ul>
    <div id="chatBox" hidden><ul id="chatLog" aria-live="polite" aria-label="대화"></ul>
      <form id="chatForm" class="chatrow"><input type="text" id="chatIn" maxlength="20" placeholder="대화하기 (한 번에 20자)" autocomplete="off" enterkeyhint="send" aria-label="대화 입력"><span id="chatCnt" class="hint">0/20</span><button type="submit" class="primary" id="chatSend">보내기</button></form></div>
    <div class="row"><button id="waveBtn" type="button">손 흔들기</button><button id="gbBtn" type="button">방명록</button><button id="soundBtn" type="button" aria-pressed="true">🔔 소리 켬</button><button id="renameBtn" class="link" type="button" hidden>이름·캐릭터 바꾸기</button><button id="ownerBtn" class="link" type="button" hidden>방 주인으로 들어가기</button><button id="ownerToggle" class="primary" type="button" hidden aria-controls="ownerPanel" aria-expanded="false">내 상태 바꾸기</button></div>
    <p class="hint" id="roomHint" hidden></p>
  </aside>
  <section class="card owner" id="ownerPanel" hidden>
    <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:nowrap"><h3 id="ownerTitle">내 상태 바꾸기 <span class="dirty" id="dirty" hidden>아직 반영 안 됨</span></h3><button type="button" id="ownerClose" class="link" aria-label="설정 창 닫기">닫기</button></div>
    <div class="field"><span>어디에 있나요? (방을 직접 눌러도 돼요)</span><div class="chips" id="zoneChips"></div></div>
    <div class="field"><span>연락</span><div class="chips" id="availChips"></div></div>
    <div class="two">
      <label class="field"><span>내 이름</span><input type="text" id="ownerName" maxlength="12" placeholder="예: 준호"></label>
      <label class="field"><span>한마디 (선택)</span><input type="text" id="msgIn" maxlength="40" placeholder="예: 과제 마감 중이라 답장 늦어요"></label>
    </div>
    <div class="field"><span>내 캐릭터</span><div class="chips" id="ownerCharChips"></div></div>
    <div class="field"><span>캐릭터 색</span><div class="chips" id="colorChips"></div></div>
    <div class="row" style="align-items:center"><button class="primary" id="saveBtn" type="button" disabled>방에 반영하기</button><span class="hint" id="saveHint">반영하면 링크로 들어온 사람들 화면이 바로 바뀌어요.</span></div>
  </section>
  <div class="dragtip">층을 누르면 그곳으로 걸어가요<br>←→ 걷기 · ↑↓ 사다리로 층 이동</div>
</div>
<div class="dlg" id="keyDlg" hidden>
  <form class="card" id="keyForm">
    <h2>방 주인 확인</h2>
    <p class="hint">서버에 설정한 주인 키를 입력하세요. 이 기기에만 저장돼요.</p>
    <input type="password" id="keyIn" autocomplete="current-password">
    <div class="row"><button type="button" id="keyCancel">취소</button><button type="submit" class="primary">방 주인으로 들어가기</button></div>
  </form>
</div>
<div class="dlg" id="nameDlg" hidden>
  <form class="card" id="nameForm">
    <h2>어떤 이름으로 들어갈까요?</h2>
    <p class="hint">방 주인과 다른 방문자에게 이 이름이 보여요.</p>
    <input type="text" id="nameIn" maxlength="16" autocomplete="off">
    <div class="field"><span>캐릭터</span><div class="chips" id="charChips"></div></div>
    <div class="row"><button type="button" id="randBtn">랜덤 이름</button><button type="submit" class="primary">들어가기</button></div>
  </form>
</div>
<div class="dlg" id="gbDlg" hidden>
  <form class="card" id="gbForm">
    <h2>방명록</h2>
    <p class="hint" id="gbHint">빨간 우체통에 한마디 남겨 주세요. 방에 들어온 모두가 볼 수 있어요.</p>
    <ul id="gbList" aria-live="polite"></ul>
    <label class="field"><span id="gbAs">이름</span><textarea id="gbText" maxlength="200" rows="2" placeholder="예: 메리 크리스마스! 다음에 놀러 갈게"></textarea></label>
    <div class="row"><button type="button" id="gbClose">닫기</button><button type="submit" class="primary" id="gbSend">남기기</button></div>
  </form>
</div>
<div class="card fullbar" id="fullBar" role="status" hidden><b>방이 꽉 찼어요 (10/10명)</b><span class="hint">자리가 나면 자동으로 들어가요. 그동안 방 안은 구경할 수 있어요.</span></div>
<div id="toast" role="status"></div></template>
<div id="app"></div>
<script type="application/json" id="state">{"owner":"","zone":"desk","msg":"","avail":"free","color":"#4f7cf0","updatedAt":0}</script>
<script id="main">
(function(){
"use strict";
var THREE_URL="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
var FONT_URL="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap";
var SAVED=JSON.parse(document.getElementById("state").textContent);
var app=document.getElementById("app");
app.appendChild(document.getElementById("tpl").content.cloneNode(true));

  $("gbHint").textContent=ok?"빨간 우체통에 한마디 남겨 주세요. 남긴 글은 24시간 동안 보여요 (최대 50개).":"방명록은 공유 링크로 들어온 방에서 쓸 수 있어요.";
  renderGB();if(ok)setTimeout(function(){$("gbText").focus()},50);
}
function closeGB(){$("gbDlg").hidden=true}
$("gbBtn").addEventListener("click",openGB);$("gbClose").addEventListener("click",closeGB);
$("gbDlg").addEventListener("click",function(e){if(e.target===this)closeGB()});
$("gbDlg").addEventListener("keydown",function(e){if(e.key==="Escape")closeGB()});
$("gbText").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("gbForm").requestSubmit?$("gbForm").requestSubmit():$("gbSend").click()}});
$("gbForm").addEventListener("submit",function(e){e.preventDefault();if(!window.ROOM_SERVER||!room)return;var t=clean($("gbText").value,200);if(!t)return;
  room.send({t:"gb_add",name:gbWho(),text:t});$("gbText").value="";var sb=$("gbSend");sb.disabled=true;setTimeout(function(){sb.disabled=false},1500)});
$("gbList").addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button[data-id]");if(!b||!isOwnerUI||!room)return;if(confirm("이 글을 방명록에서 지울까요?"))room.send({t:"gb_del",id:b.getAttribute("data-id")})});
function onGB(list){var cut=Date.now()-86400000;gbItems=Array.isArray(list)?list.slice(-50).filter(function(it){return it&&typeof it.text==="string"&&+it.at>cut}).map(function(it){return {id:String(it.id),name:clean(it.name,16)||"손님",text:clean(it.text,200),at:+it.at||0,owner:!!it.owner}}):[];renderGB()}

/* ---------- doorbell: "ding-dong" when a new visitor arrives ---------- */
var actx=null,soundOn=store("myroom.sound")!=="off",knownPeers=null,leftNames={},lastBell=0;
function unlockAudio(){try{if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}if(actx&&actx.state==="suspended")actx.resume()}catch(e){}}
["pointerdown","keydown","touchstart"].forEach(function(ev){window.addEventListener(ev,unlockAudio,{passive:true})});
function tone(f,t0,dur,vol){var o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();o.type="sine";o2.type="sine";o.frequency.value=f;o2.frequency.value=f*2.01;
  var g2=actx.createGain();g2.gain.value=0.18;o2.connect(g2);g2.connect(g);o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.start(t0);o2.start(t0);o.stop(t0+dur+0.05);o2.stop(t0+dur+0.05)}
function dingDong(){if(!soundOn||!actx||actx.state!=="running")return;var n=Date.now();if(n-lastBell<1500)return;lastBell=n;var t=actx.currentTime+0.02;tone(659.25,t,1.1,0.32);tone(523.25,t+0.42,1.5,0.32)}
function renderSoundBtn(){var b=$("soundBtn");b.textContent=soundOn?"🔔 소리 켬":"🔕 소리 끔";b.setAttribute("aria-pressed",String(soundOn));b.title=soundOn?"새 방문자가 오면 띵동 소리가 나요":"소리가 꺼져 있어요"}
$("soundBtn").addEventListener("click",function(){soundOn=!soundOn;store("myroom.sound",soundOn?"on":"off");renderSoundBtn();unlockAudio();if(soundOn){lastBell=0;setTimeout(dingDong,60)}});
renderSoundBtn();
function checkArrivals(list){
  var now=Date.now(),cur={};
  list.forEach(function(p){if(p.kind==="viewer"&&!p.sameTab)cur[p.peer]=(p.presence&&clean(p.presence.name,16))||""});
  if(knownPeers===null){knownPeers=cur;return}
  for(var k in knownPeers){if(!(k in cur)&&knownPeers[k])leftNames[knownPeers[k]]=now}
  var fresh=[];for(var k2 in cur){if(!(k2 in knownPeers))fresh.push(k2)}
  knownPeers=cur;if(!fresh.length)return;
  setTimeout(function(){
    var names=[],ring=false;
    fresh.forEach(function(k){var pr=null;peersNow.forEach(function(p){if(p.peer===k)pr=p.presence||{}});if(!pr)return;
      var nm=clean(pr.name,16);if(nm&&leftNames[nm]&&Date.now()-leftNames[nm]<30000)return; // same person just reloaded
      ring=true;names.push(pr.role==="owner"?(view.owner||"방 주인"):(nm||"새 손님"))});
    if(!ring)return;dingDong();toast("띵동! "+names.join(", ")+"님이 들어왔어요")},700);
}
/* ---------- chat (max 20 chars per message) ---------- */
var chatItems=[],ownerSay=null;
function renderChat(){
  var ul=$("chatLog");ul.textContent="";
  if(!chatItems.length){var e=document.createElement("li");e.className="empty";e.textContent="아직 대화가 없어요. 먼저 인사해 보세요!";ul.appendChild(e);return}
  chatItems.slice(-20).forEach(function(c){var li=document.createElement("li"),b=document.createElement("b"),t=document.createElement("span");
    if(c.owner)li.className="own";if(c.me)li.className+=" me";b.textContent=c.name+(c.owner?" (주인)":"")+":";t.textContent=c.text;li.appendChild(b);li.appendChild(t);ul.appendChild(li)});
  ul.scrollTop=ul.scrollHeight;
}
function onChat(m,isMe,quiet){
  if(!m||typeof m.text!=="string")return;
  var c={name:clean(m.name,16)||"손님",text:clean(m.text,20),owner:!!m.owner,me:!!isMe,at:+m.at||Date.now()};if(!c.text)return;
  chatItems.push(c);if(chatItems.length>30)chatItems.shift();
  if(quiet)return;renderChat();if(folded&&!isMe){unread++;renderFold()}
  if(Date.now()-c.at>15000)return;
  var until=Date.now()+6000;
  if(c.owner){ownerSay={text:c.text,until:until};renderStatus();return}
  var G=isMe?self:guests[String(m.from)];
  if(G&&G.bub){G.bub.el.textContent=c.text;G.bub.el.hidden=false;G.sayUntil=until}
}
$("chatForm").addEventListener("submit",function(e){e.preventDefault();if(!window.ROOM_SERVER||!room)return;var t=clean($("chatIn").value,20);if(!t)return;
  room.send({t:"chat",text:t});$("chatIn").value="";$("chatCnt").textContent="0/20";
  if(window.matchMedia&&matchMedia("(pointer: coarse)").matches)$("chatIn").blur()});
$("chatIn").addEventListener("input",function(){$("chatCnt").textContent=this.value.length+"/20"});
$("chatIn").addEventListener("keydown",function(e){if(e.key==="Enter"&&e.isComposing){e.preventDefault()}});
if(window.ROOM_SERVER){$("chatBox").hidden=false;renderChat()}

/* ---------- fold / unfold the bottom card ---------- */
var folded=store("myroom.fold")==="1",unread=0;
function renderFold(){var c=document.querySelector(".people"),b=$("peopleFold");c.classList.toggle("folded",folded);b.setAttribute("aria-expanded",String(!folded));
  b.textContent=folded?(unread?"펴기 ▲ · 💬"+unread:"펴기 ▲"):"접기 ▼";b.classList.toggle("unread",folded&&unread>0);b.title=folded?"방명록·대화·내 상태 버튼 펼치기":"아래 창 접기"}
function setFold(f){folded=f;if(!f)unread=0;store("myroom.fold",f?"1":"0");renderFold();if(typeof refit==="function")refit()}
$("peopleFold").addEventListener("click",function(e){e.stopPropagation();setFold(!folded)});
document.querySelector(".people h2").addEventListener("click",function(){if(folded)setFold(false)});
renderFold();

/* ---------- owner name/status kept on this device ---------- */
function savedOwner(){try{var o=JSON.parse(store("myroom.ownerStatus")||"null");return o&&typeof o==="object"?o:null}catch(e){return null}}
function restoreOwner(){
  if(!isOwnerUI)return;var sv=savedOwner();if(!sv)return;var p={};
  if(!view.owner&&sv.owner)p.owner=clean(sv.owner,12);
  if(!view.updatedAt){if(ZONES[sv.zone])p.zone=sv.zone;if(AVAIL[sv.avail])p.avail=sv.avail;if(CHARS[sv.char])p.char=sv.char;if(COLORS.indexOf(sv.color)>=0)p.color=sv.color;if(typeof sv.msg==="string")p.msg=clean(sv.msg,40)}
  if(Object.keys(p).length){setPending(p);$("ownerName").value=pend.owner||"";$("msgIn").value=pend.msg||""}
}
function ownerStatusLoaded(st){if(isOwnerUI&&st&&(!st.owner||!st.updatedAt)){if(!st.owner&&view.owner){setPending({owner:view.owner})}else restoreOwner()}}

/* ---------- boot ---------- */
if(hasGL){try{initGL()}catch(e){hasGL=false;console.error(e)}}
if(!hasGL){canvas.style.display="none";$("ui").querySelector(".dragtip").hidden=true}
renderStatus();renderPeople();applyTime();setInterval(applyTime,60000);
/* server mode: own WebSocket server, no sign-in needed */
var VID=(function(){var v=store("myroom.vid");if(!/^[a-z0-9]{8,40}$/.test(v||"")){v=(Math.random().toString(36).slice(2)+Date.now().toString(36)).replace(/[^a-z0-9]/g,"").slice(0,24);store("myroom.vid",v)}return v})();
function wsRoom(){
  var ws,myId=null,handlers=[],mine={},backoff=1000;
  function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
  function connect(){
    ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
    ws.onopen=function(){backoff=1000;send({t:"id",vid:VID});send({t:"presence",patch:mine});var k=store("myroom.ownerKey");if(k)send({t:"auth",key:k})};
    ws.onmessage=function(ev){var m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.t==="hello"){myId=m.id;applyStatus(m.status);onGB(m.gb);chatItems=[];(Array.isArray(m.chats)?m.chats:[]).forEach(function(x){onChat(x,false,true)});renderChat();ownerStatusLoaded(m.status)}
      else if(m.t==="gb")onGB(m.list);
      else if(m.t==="chat")onChat(m,m.from===myId,false);
      else if(m.t==="chat_err")toast("조금 천천히 보내 주세요.");
      else if(m.t==="gb_err")toast(m.msg==="slow"?"조금 있다가 다시 남겨 주세요.":"방명록에 남기지 못했어요.");
      else if(m.t==="peers"&&Array.isArray(m.peers)){var ps=m.peers.map(function(p){return {peer:String(p.id),kind:"viewer",sameTab:p.id===myId,isMe:p.id===myId,presence:p.presence||{}}});handlers.forEach(function(h){h({peers:ps})})}
      else if(m.t==="status")applyStatus(m.status);
      else if(m.t==="auth")onAuth(!!m.ok);
      else if(m.t==="saved")onSaved(!!m.ok)};
    ws.onclose=function(){setTimeout(connect,backoff);backoff=Math.min(15000,backoff*2)};
  }
  connect();
  // 창을 닫거나 다른 앱으로 넘어갈 때 연결을 바로 끊어서 유령 방문자가 남지 않게 해요
  window.addEventListener("pagehide",function(){try{ws.onclose=null;ws.close()}catch(e){}});
  window.addEventListener("pageshow",function(ev){if(ev.persisted&&(!ws||ws.readyState>1))connect()});
  return {send:send,
    presence:function(p){for(var k in p){if(p[k]===null)delete mine[k];else mine[k]=p[k]}send({t:"presence",patch:p});return Promise.resolve()},
    onPeers:function(h){handlers.push(h);return function(){}}};
}
function onAuth(ok){
  if(ok){var first=!isOwnerUI;if(first){enableOwner();restoreOwner()}$("nameDlg").hidden=true;$("keyDlg").hidden=true;$("renameBtn").hidden=true;$("ownerBtn").hidden=true;
    if(self){dropWalker(self);self=null;if(destRing)destRing.visible=false}room.presence({name:view.owner||"방 주인",color:view.color});renderPeople();
    if(first)toast("방 주인으로 들어왔어요. '내 상태 바꾸기'를 누르면 설정 창이 열려요.")}
  else{store("myroom.ownerKey","");$("ownerBtn").hidden=false;toast("주인 키가 맞지 않아요. 다시 입력해 주세요.");askKey()}
}
function askKey(){
  if(isOwnerUI)return;var d=$("keyDlg"),inp=$("keyIn");$("nameDlg").hidden=true;d.hidden=false;inp.value="";setTimeout(function(){inp.focus()},50);
  $("keyCancel").onclick=function(){d.hidden=true;if(location.hash==="#owner")history.replaceState(null,"",location.pathname);$("renameBtn").hidden=false;if(!myName)askName()};
  $("keyForm").onsubmit=function(e){e.preventDefault();var k=inp.value.trim();if(!k)return;store("myroom.ownerKey",k);d.hidden=true;toast("주인 키 확인 중…");room.send({t:"auth",key:k})}}
$("ownerBtn").addEventListener("click",askKey);
window.addEventListener("hashchange",function(){if(window.ROOM_SERVER&&location.hash==="#owner"&&!isOwnerUI)askKey()});
if(window.ROOM_SERVER){
  room=wsRoom();
  if(location.hash==="#owner"||store("myroom.ownerKey")){if(!store("myroom.ownerKey"))askKey()}
  else{$("renameBtn").hidden=false;$("ownerBtn").hidden=false;if(!myName)askName()}
  room.presence({name:myName||"손님",color:myColor(),wave:0,char:myChar});
  room.onPeers(function(ch){peersNow=ch.peers;checkArrivals(peersNow);renderPeople()});
}else{
var claudeRT=window.claude;
var useCap=function(n){return claudeRT&&claudeRT.use?claudeRT.use(n).catch(function(){return null}):Promise.resolve(null)};
var nameTimer=setTimeout(function(){if(!isOwnerUI&&!myName)askName()},2500);
Promise.all([useCap("user"),useCap("artifact")]).then(function(r){
  var user=r[0];artifactApi=r[1];
  return (user?user.canEdit():Promise.resolve(false)).then(function(can){
    clearTimeout(nameTimer);
    if(can&&artifactApi){enableOwner();$("nameDlg").hidden=true}
    else{$("renameBtn").hidden=false;if(!myName&&$("nameDlg").hidden)askName()}
    renderPeople();
    return useCap("room");
  });
}).then(function(rm){
  if(!rm){$("roomHint").hidden=false;$("roomHint").textContent="다른 방문자 표시는 claude.ai에 로그인한 사람끼리만 보여요.";return}
  room=rm;
  var me=isOwnerUI?{name:view.owner||"방 주인",role:"owner",color:view.color,wave:0,joinedAt:joinedAt}:{name:myName||"손님",role:"guest",color:myColor(),wave:0,joinedAt:joinedAt,char:myChar};
  room.presence(me).catch(function(){});sendPos(true);
  room.onPeers(function(ch){peersNow=ch.peers.slice();checkArrivals(peersNow);renderPeople()},function(){room=null;peersNow=[];renderPeople()});
}).catch(function(){});
}
})();
</script>
